services:
  - type: web
    name: face-emotion-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && cd backend && python download_model_gdrive.py
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HOST
        value: 0.0.0.0
      - key: GDRIVE_MODEL_ID
        value: 1db-KVbw_tyFSfhW8RthSOeSo2GxfdeSv
    healthCheckPath: /
